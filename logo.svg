<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Minimalist Building + Pulse Icon -->
  <g transform="translate(10, 8)">
    <!-- Building Contour -->
    <path d="M 6,36 L 6,18 L 18,10 L 30,18 L 30,36 Z" fill="none" stroke="#4DA3FF" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 14,36 L 14,24 L 22,24 L 22,36" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linejoin="round" />
    <!-- Pulse Line -->
    <path d="M 2,28 L 10,28 L 15,20 L 22,32 L 28,14 L 34,22 L 42,22" fill="none" stroke="#27C281" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Highlighted Outlier Point -->
    <circle cx="28" cy="14" r="3.5" fill="#F2B84B" stroke="#0B0F14" stroke-width="1.5" />
  </g>
  <!-- Wordmark Text -->
  <text x="62" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" fill="#F5F7FA" letter-spacing="1.5">PROPERTY PULSE</text>
  <text x="62" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" fill="#9AA6B2" letter-spacing="0.8">REAL ESTATE ANALYTICS</text>
</svg>
